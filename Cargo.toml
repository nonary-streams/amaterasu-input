[workspace]
resolver = "2"
members = ["modules/input", "crates/input-companion"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "afeeab49f828ace1b6c9ed5a138701e1b8d3ba68" }
amaterasu-storage = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "afeeab49f828ace1b6c9ed5a138701e1b8d3ba68" }
amaterasu-gamestream = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "a5088b27d2632f9746b685223f6d7876702938ed" }
amaterasu-input-policy = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "a5088b27d2632f9746b685223f6d7876702938ed" }
amaterasu-input-companion = { path = "crates/input-companion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
