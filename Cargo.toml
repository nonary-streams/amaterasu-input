[workspace]
resolver = "2"
members = ["modules/input", "crates/input-companion"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "37e007d102be65041e9817c63495e308bfc0b369" }
amaterasu-storage = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "37e007d102be65041e9817c63495e308bfc0b369" }
amaterasu-gamestream = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "83796e4d5f67550a0cb4d515a938dd9895fc36f1" }
amaterasu-input-policy = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "83796e4d5f67550a0cb4d515a938dd9895fc36f1" }
amaterasu-input-companion = { path = "crates/input-companion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
