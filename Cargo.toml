[workspace]
resolver = "2"
members = ["modules/input", "crates/input-companion"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
amaterasu-module-sdk = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "6532699fdce2a0335e9b23ea96c9dfdbfec597a1" }
amaterasu-storage = { git = "https://github.com/nonary-streams/amaterasu-sdk.git", rev = "6532699fdce2a0335e9b23ea96c9dfdbfec597a1" }
amaterasu-gamestream = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "3199aaa3974d5f582d2c72763dfe64188a33ab8d" }
amaterasu-input-policy = { git = "https://github.com/nonary-streams/amaterasu-protocol.git", rev = "3199aaa3974d5f582d2c72763dfe64188a33ab8d" }
amaterasu-input-companion = { path = "crates/input-companion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
